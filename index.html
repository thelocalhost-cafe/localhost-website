  <style>
    :root {
      --bg: #300A24;
      --fg: #EEEEEC;
      --muted: #8a7a83;
      --user: #8AE234;   /* Ubuntu bold green */
      --path: #729FCF;   /* Ubuntu bold blue  */
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: "Ubuntu Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      padding: 2rem 1.25rem;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      text-align: left;
    }

    .logo {
      font-size: clamp(1.25rem, 7vw, 4rem);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }

    .user { color: var(--user); }
    .path { color: var(--path); }
    .sep,
    .dollar { color: var(--fg); }

    .cursor {
      display: inline-block;
      margin-left: 0.05em;
      animation: blink 1s steps(1) infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .comment {
      color: var(--muted);
      font-size: clamp(0.9rem, 2.2vw, 1.15rem);
      margin-left: 0.25rem;
    }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
      padding-top: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    footer a {
      color: var(--muted);
      text-decoration: none;
      border-bottom: 1px dashed transparent;
      transition: color 0.15s ease, border-color 0.15s ease;
    }

    footer a:hover,
    footer a:focus-visible {
      color: var(--fg);
      border-bottom-color: var(--fg);
      outline: none;
    }

    .socials {
      display: flex;
      gap: 1.25rem;
      align-items: center;
    }

    .socials a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      border-bottom: none;
      transition: color 0.15s ease, transform 0.15s ease;
    }

    .socials a:hover,
    .socials a:focus-visible {
      color: var(--fg);
      border-bottom: none;
      transform: translateY(-1px);
    }

    .socials svg {
      width: 1.5rem;
      height: 1.5rem;
      fill: currentColor;
      display: block;
    }


    @media (prefers-reduced-motion: reduce) {
      .cursor { animation: none; }
    }
  </style>
</head>
